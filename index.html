<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>창조국어 01 · 큰 칸에 써요</title>
<style>
:root{
  --page:#fffcf6; --panel:#ffffff; --ink:#3a3a44; --soft:#8a8790; --line:#cfc8be; --guide:#e7e1d8;
  --ok:#2e9a5a; --warn:#d2763f; --blue:#367dc6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);color:var(--ink);
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
body{min-height:100vh;-webkit-user-select:none;user-select:none}
.wrap{max-width:980px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px 40px}
.hdr img,.title img{display:block;width:100%;height:auto}
.title{position:relative;margin-top:6px}
.tools{display:flex;gap:10px;justify-content:flex-end;margin:6px 0 4px}
.tool{border:0;background:#fff;border-radius:999px;padding:10px 16px;font-size:17px;color:var(--ink);
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 0 0 1px #eee8df inset;display:flex;align-items:center;gap:8px;cursor:pointer;position:relative;overflow:hidden}
.tool svg{width:22px;height:22px}
.tool .hold{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--blue)}
.cols{display:grid;grid-template-columns:var(--lab) repeat(5,1fr);gap:var(--gap);margin:10px 0 6px;
  font-family:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;color:var(--soft);font-size:15px;text-align:center}
.row{display:grid;grid-template-columns:var(--lab) repeat(5,1fr);gap:var(--gap);align-items:center;
  background:var(--panel);border-radius:18px;padding:12px;margin-bottom:14px}
:root{--lab:23%;--gap:10px}
.lab{border:0;padding:0;background:none;cursor:pointer;text-align:left}
.lab img{width:100%;height:auto;display:block}
.box{position:relative;aspect-ratio:1/1;cursor:pointer}
.box svg{width:100%;height:100%;display:block}
.box .badge{position:absolute;right:-6px;top:-8px;width:clamp(18px,24%,30px);height:clamp(18px,24%,30px);border-radius:50%;background:var(--ok);
  color:#fff;display:none;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.box.done .badge{display:flex}
.box .play{position:absolute;left:5%;bottom:5%;width:clamp(12px,20%,26px);height:clamp(12px,20%,26px);border-radius:50%;background:rgba(58,58,68,.78);
  display:flex;align-items:center;justify-content:center}
.box .play svg{width:46%;height:46%}
/* practice */
.modal{position:fixed;inset:0;background:rgba(255,252,246,.97);display:none;z-index:10;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.big{position:relative;width:min(84vw,68vh);aspect-ratio:1/1;touch-action:none}
.big svg{width:100%;height:100%;display:block;touch-action:none}
.bar{display:flex;gap:16px;margin-top:18px}
.bt{width:74px;height:74px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.08),0 0 0 1px #eee8df inset;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.bt svg{width:34px;height:34px}
.bt.main{background:var(--ink)}
.which{font-size:20px;color:var(--soft);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.which img{height:28px}
.stars{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.stars span{font-size:min(16vw,120px);opacity:0;transform:scale(.4);transition:all .45s cubic-bezier(.2,1.4,.4,1)}
.stars.on span{opacity:1;transform:scale(1)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
/* parent */
.parent{position:fixed;inset:0;background:var(--page);z-index:20;display:none;overflow:auto}
.parent.on{display:block}
.parent .wrap{max-width:900px}
.parent h2{font-size:24px;margin:8px 0 4px}
.parent .sum{color:var(--soft);margin-bottom:16px;font-size:16px}
.prow{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:120px repeat(4,1fr);gap:12px;align-items:start}
.prow img{width:100%}
.pcell{font-size:14px;color:var(--soft);text-align:center}
.pcell svg{width:100%;aspect-ratio:1/1;display:block;margin-bottom:6px}
.pcell b{display:block;color:var(--ink);font-size:15px}
.ptools{display:flex;gap:10px;margin:18px 0}
.ptools button{font-size:16px;padding:10px 18px;border-radius:12px;border:1px solid #e3ddd3;background:#fff;color:var(--ink);cursor:pointer}
.ask{display:none;background:#fff;border:1px solid #eadfd2;border-radius:14px;padding:14px;margin:8px 0}
.ask.on{display:block}
/* print: the page as a worksheet */
@page{size:A4;margin:12mm}
@media print{
  html,body{background:var(--page);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tools,.modal,.parent,.play,.badge{display:none!important}
  .wrap{max-width:none;padding:0}
  .row{break-inside:avoid;padding:6px;margin-bottom:8px;border:1px solid #f0ebe3}
  .ink{display:none}
}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#33302c;color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;line-height:1.45;max-width:90vw;text-align:center;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}.toast.on{opacity:.95}
@media print{.toast{display:none}}
@media (max-width:640px){:root{--lab:26%;--gap:6px}.cols{font-size:12px}.row{padding:8px;border-radius:12px}.tool span{display:none}}
</style>
</head>

function pickVoice(){const vs=speechSynthesis.getVoices(); VOICE=vs.find(v=>/^ko/i.test(v.lang)&&v.localService)||vs.find(v=>/^ko/i.test(v.lang))||null; return VOICE;}

function noVoice(){if(warned) return; warned=true; toast("이 화면에서는 한국어 목소리를 찾지 못했어요. 크롬·엣지·사파리에서 열어 주세요. 휴대폰은 무음 모드를 꺼 주세요.");}
function say(t){
  if(!soundOn) return;
  if(!HAS_TTS){noVoice(); return;}
  if(!VOICE) pickVoice();
  const go=()=>{try{
    const u=new SpeechSynthesisUtterance(t); u.lang="ko-KR"; u.rate=0.9; u.pitch=1.1; if(VOICE) u.voice=VOICE;
    u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled") noVoice();};
    say.u=u; speechSynthesis.resume(); speechSynthesis.speak(u);
    setTimeout(()=>{if(!VOICE&&!pickVoice()) noVoice();},1500);
  }catch(e){noVoice();}};
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel(); setTimeout(go,80);} else go();
}

// ---------------------------------------------------------------- geometry helpers
function el(n,a,p){const e=document.createElementNS(NS,n); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e;}
function plen(P){let L=0;for(let i=1;i<P.length;i++)L+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);return L;}
function resample(P,n){
  const L=plen(P); if(L===0) return Array(n).fill(P[0]);
  const out=[P[0]]; let acc=0,i=1,step=L/(n-1),need=step,prev=P[0];
  while(out.length<n-1&&i<P.length){
    const d=Math.hypot(P[i][0]-prev[0],P[i][1]-prev[1]);
    if(acc+d>=need){const t=(need-acc)/d; const q=[prev[0]+(P[i][0]-prev[0])*t,prev[1]+(P[i][1]-prev[1])*t]; out.push(q); prev=q; acc=need; need+=step;}
    else{acc+=d; prev=P[i]; i++;}
  }
  out.push(P[P.length-1]); return out;
}
function dseg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy; let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}
function dpoly(p,P){let m=1e9;for(let i=1;i<P.length;i++)m=Math.min(m,dseg(p,P[i-1],P[i]));return P.length===1?Math.hypot(p[0]-P[0][0],p[1]-P[0][1]):m;}
function area(P){let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;}
// centre line the reveal pen follows, carried a little past both ends so the stroke's tips are covered
function penPath(st){
  const P=st.pts.slice();
  if(st.ring){ // a ring is a loop: run a little past the start so it closes
    const extra=P.slice(1,6); return P.concat(extra);
  }
  const e=st.reach;
  const a=P[0],b=P[1],y=P[P.length-1],z=P[P.length-2];
  const u=[a[0]-b[0],a[1]-b[1]],lu=Math.hypot(...u)||1, v=[y[0]-z[0],y[1]-z[1]],lv=Math.hypot(...v)||1;
  return [[a[0]+u[0]/lu*e,a[1]+u[1]/lu*e]].concat(P,[[y[0]+v[0]/lv*e,y[1]+v[1]/lv*e]]);
}
const dpath=P=>"M"+P.map(p=>p[0].toFixed(2)+" "+p[1].toFixed(2)).join("L");
// ---------------------------------------------------------------- one letter box as SVG
let uid=0;
function letterSVG(b,opts){
  const s=b.side, svg=el("svg",{viewBox:`0 0 ${s} ${s}`,"aria-hidden":"true"});
  const r=Math.max(2,s*0.055);
  el("rect",{x:0.75,y:0.75,width:s-1.5,height:s-1.5,rx:r,fill:"#fff",stroke:"#cfc8be","stroke-width":1.2},svg);
  el("path",{d:`M${s/2} 3V${s-3}M3 ${s/2}H${s-3}`,stroke:"#e7e1d8","stroke-width":0.8,"stroke-dasharray":"2.2 2.2",fill:"none"},svg);
  const id="b"+(uid++);
  const defs=el("defs",{},svg);
  // the finished letter (static)
  const still=el("g",{},svg);
  for(const it of b.items) el("path",{d:it.d,fill:opts.grey?it.fill:it.fill,stroke:it.stroke||"none","stroke-width":it.sw?it.sw*2:0,"paint-order":"stroke"},still);
  // the moving letter: every stroke's own pixels, uncovered by its pen
  const moving=el("g",{style:"display:none"},svg);
  const pens=[];
  b.strokes.forEach((st,k)=>{
    const it=b.items[st.item];
    const cp=el("clipPath",{id:`${id}c${k}`},defs); el("path",{d:st.region},cp);
    const mk=el("mask",{id:`${id}m${k}`,maskUnits:"userSpaceOnUse",x:-10,y:-10,width:s+20,height:s+20},defs);
    const P=penPath(st), L=plen(P);
    const pen=el("path",{d:dpath(P),fill:"none",stroke:"#fff","stroke-width":st.reach*2,"stroke-linecap":"butt","stroke-linejoin":"round","stroke-dasharray":`${L} ${L+1}`,"stroke-dashoffset":L},mk);
    const g=el("g",{mask:`url(#${id}m${k})`},moving);
    // the letter's own crisp outline, cut to the part this stroke writes
    el("path",{d:it.d,fill:it.fill,stroke:it.stroke||"none","stroke-width":it.sw?it.sw*2:0,"paint-order":"stroke","clip-path":`url(#${id}c${k})`},g);
    pens.push({pen,L,st});
  });
  const ink=el("g",{class:"ink"},svg);
  const hint=el("g",{},svg);
  return {svg,still,moving,pens,ink,hint,b};
}
// stroke timings: the same pen speed as the GIFs
function timings(b){ return b.strokes.map(st=>[st.t0,st.t1]); }     // exactly the GIF's timing
function play(L,done,only){
  L.still.style.display="none"; L.moving.style.display="";
  const T=timings(L.b); const t0=performance.now()/1000;
  L.pens.forEach((p,k)=>{p.pen.setAttribute("stroke-dashoffset",(only==null||k>=only)?p.L:0);});
  const range=only==null?[0,L.pens.length]:[only,only+1];
  const base=T[range[0]][0];
  if(L.raf) cancelAnimationFrame(L.raf);
  const step=()=>{
    const t=performance.now()/1000-t0+base; let busy=false;
    for(let k=range[0];k<range[1];k++){
      const [a,c]=T[k]; const f=Math.max(0,Math.min(1,(t-a)/(c-a)));
      L.pens[k].pen.setAttribute("stroke-dashoffset",L.pens[k].L*(1-f)); if(f<1) busy=true;
    }
    if(busy) L.raf=requestAnimationFrame(step);
    else{ if(only==null){L.still.style.display="";L.moving.style.display="none";} if(done) done(); }
  };
  L.raf=requestAnimationFrame(step);
}
// ---------------------------------------------------------------- checking a written stroke against the book's
function judge(child,ref,side,k){
  const c=resample(child.map(p=>[p[0]/side,p[1]/side]),32);
  const r=resample(ref.pts.map(p=>[p[0]/side,p[1]/side]),32);
  const cL=plen(c), rL=plen(r);
  const fit=c.reduce((s,p)=>s+dpoly(p,r),0)/c.length;          // how close the child stays to the line
  const cover=r.reduce((s,p)=>s+dpoly(p,c),0)/r.length;        // how much of the line the child covered
  const d0=Math.hypot(c[0][0]-r[0][0],c[0][1]-r[0][1]);
  if(ref.ring){
    const closed=Math.hypot(c[0][0]-c[c.length-1][0],c[0][1]-c[c.length-1][1]);
    if(cL<0.45*rL) return "shape";
    if(d0>0.17) return "start";
    if(Math.sign(area(c))!==Math.sign(area(r))) return "dir";
    if(fit>0.075||cover>0.085||closed>0.22) return "shape";
    return "ok";
  }
  const d1=Math.hypot(c[c.length-1][0]-r[r.length-1][0],c[c.length-1][1]-r[r.length-1][1]);
  const rev0=Math.hypot(c[0][0]-r[r.length-1][0],c[0][1]-r[r.length-1][1]);
  if(cL<0.4*rL) return "shape";
  if(d0>0.16&&rev0<0.16) return "dir";
  if(d0>0.16) return "start";
  if(d1>0.18||fit>0.07||cover>0.08||cL>1.7*rL) return "shape";
  return "ok";
}
const TELL={
  start:"시작하는 곳이 달라요. 반짝이는 점에서 시작해요.",
  dir:"방향이 반대예요. 화살표를 따라 써요.",
  order:"쓰는 순서가 달라요. 먼저 이 획을 써요.",
  shape:"선을 따라 천천히 다시 써 봐요."
};
const PRAISE=["참 잘했어요!","멋져요!","바르게 썼어요!"];
// ---------------------------------------------------------------- page
const rowsEl=document.getElementById("rows");
const BOXES=DATA.boxes; const views=[];
for(let r=0;r<3;r++){
  const row=document.createElement("div"); row.className="row";
  const lab=document.createElement("button"); lab.className="lab"; lab.setAttribute("aria-label",ROWS[r].name+" 읽어 주기");
  lab.innerHTML=`<img alt="${ROWS[r].name}" src="${ROWS[r].img}">`; lab.onclick=()=>say(ROWS[r].say);
  row.appendChild(lab);
  for(let c=0;c<5;c++){
    const i=r*5+c, b=BOXES[i];
    const box=document.createElement("div"); box.className="box"; box.dataset.i=i;
    box.setAttribute("role","button"); box.setAttribute("aria-label",`${ROWS[r].name} ${KIND[c]}`);
    const L=letterSVG(b,{}); box.appendChild(L.svg);
    if(c===0){box.insertAdjacentHTML("beforeend",'<span class="play"><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4v16l13-8z"/></svg></span>');
      box.onclick=()=>{say(ROWS[r].say); play(L);};}
    else{box.insertAdjacentHTML("beforeend",'<span class="badge">✓</span>'); box.onclick=()=>openPractice(r,c);}
    views[i]=L; row.appendChild(box);
  }
  rowsEl.appendChild(row);
}
function refreshPage(){
  for(let i=0;i<BOXES.length;i++){
    if(i%5===0) continue;
    const R=mem.boxes[i]; const box=rowsEl.querySelector(`.box[data-i="${i}"]`);
    box.classList.toggle("done",!!(R&&R.done));
    drawInk(views[i].ink,R&&R.ink,BOXES[i]);
  }
}
function drawInk(g,ink,b){
  while(g.firstChild) g.removeChild(g.firstChild);
  if(!ink) return;
  const w=Math.max(2.4,b.strokes[0].w*0.42);
  for(const P of ink) el("path",{d:dpath(P.map(p=>[p[0]*b.side,p[1]*b.side])),fill:"none",stroke:"#3a3a44","stroke-width":w,"stroke-linecap":"round","stroke-linejoin":"round",opacity:.85},g);
}
// ---------------------------------------------------------------- practice in the big box
const modal=document.getElementById("modal"), bigEl=document.getElementById("big");
let P=null;
function openPractice(r,c){
  const i=r*5+c, b=BOXES[i], see=BOXES[r*5];
  bigEl.innerHTML="";
  const L=letterSVG(b,{grey:true}); bigEl.appendChild(L.svg);
  const color=letterSVG(see,{}); // the coloured letter, shown when the child gets it right
  const stars=document.createElement("div"); stars.className="stars"; stars.innerHTML="<span>⭐</span>"; bigEl.appendChild(stars);
  document.getElementById("which").innerHTML=`<img alt="" src="${ROWS[r].img}"> ${KIND[c]}`;
  P={r,c,i,b,L,see,strokes:[],cur:null,k:0,busy:false,stars};
  modal.classList.add("on");
  rec(i);
  say(ROWS[r].say);
  showStart(0);
}
function showStart(k){
  const {L,b}=P; const g=L.hint; while(g.firstChild) g.removeChild(g.firstChild);
  if(k>=b.strokes.length) return;
  const st=b.strokes[k], s=b.side, a=st.pts[0];
  el("circle",{cx:a[0],cy:a[1],r:s*0.045,fill:"#d2763f",class:"pulse"},g);
  // a small arrow along the first part of the stroke shows the direction
  const q=resample(st.pts,12); const p1=q[Math.min(3,q.length-1)];
  const ang=Math.atan2(p1[1]-a[1],p1[0]-a[0]); const ah=s*0.05;
  const tip=[a[0]+Math.cos(ang)*s*0.11,a[1]+Math.sin(ang)*s*0.11];
  el("path",{d:`M${a[0]} ${a[1]}L${tip[0]} ${tip[1]}`,stroke:"#d2763f","stroke-width":s*0.012,"stroke-linecap":"round"},g);
  el("path",{d:`M${tip[0]+Math.cos(ang+2.5)*ah} ${tip[1]+Math.sin(ang+2.5)*ah}L${tip[0]} ${tip[1]}L${tip[0]+Math.cos(ang-2.5)*ah} ${tip[1]+Math.sin(ang-2.5)*ah}`,stroke:"#d2763f","stroke-width":s*0.012,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"},g);
}
function toLocal(e){
  const svg=P.L.svg, pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const q=pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x,q.y];
}
bigEl.addEventListener("pointerdown",e=>{
  if(!P||P.busy) return; e.preventDefault(); bigEl.setPointerCapture(e.pointerId);
  const p=toLocal(e); const w=Math.max(2.4,P.b.strokes[0].w*0.42);
  P.cur={pts:[p],node:el("path",{d:dpath([p,p]),fill:"none",stroke:"#3a3a44","stroke-width":w,"stroke-linecap":"round","stroke-linejoin":"round"},P.L.ink)};
});
bigEl.addEventListener("pointermove",e=>{
  if(!P||!P.cur) return; e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of evs){const p=toLocal(ev); const q=P.cur.pts[P.cur.pts.length-1]; if(Math.hypot(p[0]-q[0],p[1]-q[1])>0.35) P.cur.pts.push(p);}
  P.cur.node.setAttribute("d",dpath(P.cur.pts));
});
function endStroke(e){
  if(!P||!P.cur) return;
  const cur=P.cur; P.cur=null;
  if(plen(cur.pts)<P.b.side*0.03){cur.node.remove(); return;}   // a tap, not a stroke
  const k=P.k, ref=P.b.strokes[k], R=rec(P.i);
  let v=judge(cur.pts,ref,P.b.side,k);
  if(v!=="ok"){ // written in the wrong order? it fits a later stroke
    for(let j=k+1;j<P.b.strokes.length;j++) if(judge(cur.pts,P.b.strokes[j],P.b.side,j)==="ok"){v="order";break;}
  }
  if(v==="ok"){
    P.strokes.push(cur.pts); P.k++; cur.node.setAttribute("stroke","#3a3a44");
    if(P.k>=P.b.strokes.length) success(); else showStart(P.k);
  }else{
    R.tries++; R.fails[v]++; R.last=Date.now(); save();
    cur.node.setAttribute("stroke","#d2763f");
    bigEl.classList.remove("shake"); void bigEl.offsetWidth; bigEl.classList.add("shake");
    say(TELL[v]); P.busy=true;
    setTimeout(()=>{cur.node.remove(); play(P.L,()=>{P.busy=false; P.L.moving.style.display="none"; P.L.still.style.display=""; showStart(P.k);},k);},700);
  }
}
bigEl.addEventListener("pointerup",endStroke); bigEl.addEventListener("pointercancel",endStroke);
function success(){
  const R=rec(P.i), side=P.b.side;
  R.tries++; R.done=true; R.last=Date.now();
  R.ink=P.strokes.map(S=>resample(S,Math.min(40,Math.max(8,S.length))).map(p=>[+(p[0]/side).toFixed(3),+(p[1]/side).toFixed(3)]));
  save(); P.busy=true;
  const g=P.L.hint; while(g.firstChild) g.removeChild(g.firstChild);
  // the letter fills with its colours, stroke by stroke, the way the book shows it
  const L=P.L; L.still.style.display="none";
  const C=letterSVG(P.see,{}); C.svg.style.cssText="position:absolute;inset:0";
  C.svg.querySelector("rect").setAttribute("fill","none"); C.svg.querySelector("rect").setAttribute("stroke","none");
  bigEl.insertBefore(C.svg,P.stars);
  play(C,()=>{P.stars.classList.add("on"); say(PRAISE[(R.tries+P.i)%PRAISE.length]); setTimeout(closePractice,1700);});
}
function closePractice(){ if(P&&P.L.raf) cancelAnimationFrame(P.L.raf); modal.classList.remove("on"); P=null; refreshPage(); }
document.getElementById("mClose").onclick=closePractice;
document.getElementById("mClear").onclick=()=>{ if(!P||P.busy) return; const g=P.L.ink; while(g.firstChild) g.removeChild(g.firstChild); P.strokes=[]; P.k=0; showStart(0); };
document.getElementById("mShow").onclick=()=>{
  if(!P||P.busy) return; P.busy=true; const g=P.L.hint; while(g.firstChild) g.removeChild(g.firstChild);
  say(ROWS[P.r].say);
  play(P.L,()=>{P.busy=false; showStart(P.k);});
};
// ---------------------------------------------------------------- parent view (press and hold, so children do not open it)
const pb=document.getElementById("parentBtn"), hb=document.getElementById("holdbar"); let holdT=null,holdS=0;
function holdStart(e){ e.preventDefault(); holdS=performance.now();
  const tick=()=>{const f=Math.min(1,(performance.now()-holdS)/1500); hb.style.width=(f*100)+"%"; if(f>=1){holdEnd(); openParent();} else holdT=requestAnimationFrame(tick);};
  holdT=requestAnimationFrame(tick); }
function holdEnd(){ cancelAnimationFrame(holdT); hb.style.width="0"; }
pb.addEventListener("pointerdown",holdStart); ["pointerup","pointerleave","pointercancel"].forEach(t=>pb.addEventListener(t,holdEnd));
pb.addEventListener("click",()=>{ if(!document.getElementById("parent").classList.contains("on")) say("부모님 보기는 길게 누르세요."); });
function openParent(){
  const box=document.getElementById("prows"); box.innerHTML="";
  let done=0,total=0;
  const why={start:"시작 위치",dir:"쓰는 방향",order:"쓰는 순서",shape:"모양"};
  for(let r=0;r<3;r++){
    const row=document.createElement("div"); row.className="prow";
    row.innerHTML=`<img alt="${ROWS[r].name}" src="${ROWS[r].img}">`;
    for(let c=1;c<5;c++){
      const i=r*5+c, R=mem.boxes[i]; total++; if(R&&R.done) done++;
      const cell=document.createElement("div"); cell.className="pcell";
      const L=letterSVG(BOXES[i],{grey:true}); drawInk(L.ink,R&&R.ink,BOXES[i]); cell.appendChild(L.svg);
      let st="아직", more="";
      if(R){
        st=R.done?"✓ 바르게 썼어요":"연습 중";
        const f=Object.entries(R.fails).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
        more=`${KIND[c]} · ${R.tries}번 시도`+(f.length?` · 어려워한 것: ${why[f[0][0]]}`:"")+(R.last?`<br>${new Date(R.last).toLocaleDateString("ko-KR")}`:"");
      }else more=KIND[c];
      cell.insertAdjacentHTML("beforeend",`<b>${st}</b>${more}`);
      row.appendChild(cell);
    }
    box.appendChild(row);
  }
  document.getElementById("psum").textContent=`따라 쓰기 ${total}칸 중 ${done}칸을 바르게 썼어요. 기록은 이 기기에만 저장됩니다.`;
  document.getElementById("parent").classList.add("on");
}
document.getElementById("pClose").onclick=()=>{document.getElementById("parent").classList.remove("on");document.getElementById("ask").classList.remove("on");};
document.getElementById("pReset").onclick=()=>document.getElementById("ask").classList.add("on");
document.getElementById("askNo").onclick=()=>document.getElementById("ask").classList.remove("on");
document.getElementById("askYes").onclick=()=>{mem={boxes:{}};save();document.getElementById("ask").classList.remove("on");refreshPage();openParent();};
// ---------------------------------------------------------------- print = the page as a worksheet
document.getElementById("print").onclick=()=>window.print();
refreshPage();
</script>
