<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>창조국어 한글편 · 깨치와 함께 한글을 만나요</title>
<style>
:root{--page:#fffcf6;--ink:#3a3a44;--soft:#8a8790;--ok:#2e9a5a;--warn:#d2763f;--blue:#367dc6;--W:595.92;--H:841.92}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#ece7df;color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
body{-webkit-user-select:none;user-select:none}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-left));
  background:rgba(255,252,246,.96);border-bottom:1px solid #e6dfd4;backdrop-filter:blur(6px)}
.top b{font-size:18px;white-space:nowrap}
.top select{font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid #e0d8cc;background:#fff;color:var(--ink);max-width:46vw}
.top .sp{flex:1}
.tool{border:0;background:#fff;border-radius:999px;padding:9px 14px;font-size:16px;color:var(--ink);
  box-shadow:0 0 0 1px #e6dfd4 inset;display:flex;align-items:center;gap:7px;cursor:pointer;position:relative;overflow:hidden;white-space:nowrap}
.tool svg{width:20px;height:20px}
.tool .hold{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--blue)}
#book{max-width:920px;margin:0 auto;padding:14px 10px 60px}
.pg{scroll-margin-top:64px;position:relative;width:100%;aspect-ratio:595.92/841.92;margin:0 auto 14px;background:var(--page);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pg>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0}
.pbar{display:flex;align-items:center;gap:10px;margin:22px auto 6px;font-size:15px;color:var(--soft)}
.pbar .tool{padding:6px 12px;font-size:14px}
.box{position:absolute;cursor:pointer}
.box svg{width:100%;height:100%;display:block;overflow:visible}
.box .badge{position:absolute;right:-12%;top:-14%;width:30%;height:30%;max-width:26px;max-height:26px;border-radius:50%;background:var(--ok);
  color:#fff;display:none;align-items:center;justify-content:center;font-size:min(2.2vw,16px);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.box.done .badge{display:flex}
.box .play{position:absolute;left:5%;bottom:5%;width:20%;height:20%;border-radius:50%;background:rgba(58,58,68,.78);display:flex;align-items:center;justify-content:center}
.box .play svg{width:46%;height:46%}
/* practice */
.modal{position:fixed;inset:0;background:rgba(255,252,246,.97);display:none;z-index:10;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.big{position:relative;width:min(84vw,66vh);aspect-ratio:1/1;touch-action:none}
.big svg{width:100%;height:100%;display:block;touch-action:none}
.bar{display:flex;gap:16px;margin-top:18px}
.bt{width:74px;height:74px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.08),0 0 0 1px #eee8df inset;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bt svg{width:34px;height:34px}
.which{font-size:20px;color:var(--soft);margin-bottom:12px}
.which b{font-size:30px;color:var(--ink);margin-left:6px}
.stars{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.stars span{font-size:min(16vw,120px);opacity:0;transform:scale(.4);transition:all .45s cubic-bezier(.2,1.4,.4,1)}
.stars.on span{opacity:1;transform:scale(1)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
/* parent */
.parent{position:fixed;inset:0;background:var(--page);z-index:20;display:none;overflow:auto}
.parent.on{display:block}
.pw{max-width:900px;margin:0 auto;padding:16px 16px 40px}
.parent h2{font-size:24px;margin:8px 0 4px}
.parent .sum{color:var(--soft);margin-bottom:16px;font-size:16px}
.les{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px}
.les h3{margin:0 0 8px;font-size:18px}
.les h3 small{color:var(--soft);font-weight:normal;margin-left:6px}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.pcell{font-size:12px;color:var(--soft);text-align:center;line-height:1.35}
.pcell svg{width:100%;aspect-ratio:1/1;display:block;margin-bottom:4px}
.pcell b{display:block;color:var(--ink);font-size:13px}
.ptools{display:flex;gap:10px;margin:18px 0}
.ptools button{font-size:16px;padding:10px 18px;border-radius:12px;border:1px solid #e3ddd3;background:#fff;color:var(--ink);cursor:pointer}
.ask{display:none;background:#fff;border:1px solid #eadfd2;border-radius:14px;padding:14px;margin:8px 0}
.ask.on{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#33302c;color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;line-height:1.45;max-width:90vw;text-align:center;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:.95}
@media (max-width:640px){.top b{display:none}.tool span{display:none}.pbar{font-size:13px}}
/* print: only the page that asked for it, as a worksheet */
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  .top,.pbar,.modal,.parent,.toast,.play,.badge,.ink{display:none!important}
  #book{max-width:none;padding:0}
  body.one .pg{display:none}
  body.one .pg.pr{display:block;width:210mm;height:297mm;margin:0;box-shadow:none}
}
</style>
</head>
<body>
<div class="top">
  <b>창조국어 한글편</b>
  <select id="jump" aria-label="쪽 이동"></select>
  <span class="sp"></span>
  <button class="tool" id="parentBtn" aria-label="부모님 보기 (길게 누르세요)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M2.5 20c.6-4 3-6 5.5-6s4.9 2 5.5 6M13.5 20c.4-2.8 1.8-4.4 3.5-4.4s3.1 1.6 3.5 4.4"/></svg><span>부모님 보기</span><i class="hold" id="holdbar"></i></button>
</div>
<main id="book"></main>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="which" id="which"></div>
  <div class="big" id="big"></div>
  <div class="bar">
    <button class="bt" id="mShow" aria-label="쓰는 순서 보기"><svg viewBox="0 0 24 24" fill="#3a3a44"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="bt" id="mClear" aria-label="지우기"><svg viewBox="0 0 24 24" fill="none" stroke="#3a3a44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button class="bt" id="mClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="#3a3a44" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>

<div class="parent" id="parent">
  <div class="pw">
    <h2>부모님 보기</h2>
    <div class="sum" id="psum"></div>
    <div id="plist"></div>
    <div class="ptools"><button id="pReset">기록 지우기</button><button id="pClose">닫기</button></div>
    <div class="ask" id="ask">이 기기에 저장된 따라 쓰기 기록을 모두 지울까요? <button id="askYes">지우기</button> <button id="askNo">그대로 두기</button></div>
  </div>
</div>

<script>
"use strict";
const NPAGES=139;
const BIG=[6, 10, 14, 18, 24, 28, 32, 38, 42, 46, 50, 56, 60, 64, 68, 72, 76, 82, 86, 90, 94, 98, 102, 109, 114, 119, 124, 131];                       // pages that are '큰 칸에 써요', in lesson order (index+1 = lesson)
const W=595.92, H=841.92;
const NS="http://www.w3.org/2000/svg";
const lessonOf=pg=>BIG.indexOf(pg)+1, two=n=>String(n).padStart(2,"0");
// ---------------------------------------------------------------- how each letter sounds
const NAME={"ㄱ":"기역","ㄲ":"쌍기역","ㄴ":"니은","ㄷ":"디귿","ㄸ":"쌍디귿","ㄹ":"리을","ㅁ":"미음","ㅂ":"비읍","ㅃ":"쌍비읍","ㅅ":"시옷","ㅆ":"쌍시옷",
  "ㅇ":"이응","ㅈ":"지읒","ㅉ":"쌍지읒","ㅊ":"치읓","ㅋ":"키읔","ㅌ":"티읕","ㅍ":"피읖","ㅎ":"히읗",
  "ㅏ":"아","ㅐ":"애","ㅑ":"야","ㅒ":"얘","ㅓ":"어","ㅔ":"에","ㅕ":"여","ㅖ":"예","ㅗ":"오","ㅘ":"와","ㅙ":"왜","ㅚ":"외","ㅛ":"요",
  "ㅜ":"우","ㅝ":"워","ㅞ":"웨","ㅟ":"위","ㅠ":"유","ㅡ":"으","ㅢ":"의","ㅣ":"이",
  "0":"영","1":"일","2":"이","3":"삼","4":"사","5":"오","6":"육","7":"칠","8":"팔","9":"구"};
const sound=ch=>NAME[ch]||ch;
// ---------------------------------------------------------------- storage (this device only)
const KEY="changjo-book-v1";
let mem={pages:{}};
try{const s=localStorage.getItem(KEY); if(s) mem=JSON.parse(s)||mem;}catch(e){}
try{ // 01과 records written by the first test page carry over
  const old=localStorage.getItem("changjo-01-v1");
  if(old&&!mem.pages[BIG[0]]){const o=JSON.parse(old); if(o&&o.boxes) mem.pages[BIG[0]]=o.boxes;}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(mem));}catch(e){}}
function recs(pg){return mem.pages[pg]||(mem.pages[pg]={});}
function rec(pg,i){const R=recs(pg); return R[i]||(R[i]={done:false,tries:0,fails:{start:0,dir:0,order:0,shape:0},last:0,ink:null});}
// ---------------------------------------------------------------- voice
let VOICE=null, warned=false, toastT=0;
const HAS_TTS="speechSynthesis" in window;
const toastEl=document.createElement("div"); toastEl.className="toast"; document.body.appendChild(toastEl);
function toast(m){toastEl.textContent=m; toastEl.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove("on"),5000);}
function pickVoice(){const vs=speechSynthesis.getVoices(); VOICE=vs.find(v=>/^ko/i.test(v.lang)&&v.localService)||vs.find(v=>/^ko/i.test(v.lang))||null; return VOICE;}
if(HAS_TTS){pickVoice(); try{speechSynthesis.addEventListener("voiceschanged",pickVoice);}catch(e){}}
function noVoice(){if(warned) return; warned=true; toast("이 화면에서는 한국어 목소리를 찾지 못했어요. 크롬·엣지·사파리에서 열어 주세요. 휴대폰은 무음 모드를 꺼 주세요.");}
function say(t){
  if(!HAS_TTS){noVoice(); return;}
  if(!VOICE) pickVoice();
  const go=()=>{try{
    const u=new SpeechSynthesisUtterance(t); u.lang="ko-KR"; u.rate=0.9; u.pitch=1.1; if(VOICE) u.voice=VOICE;
    u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled") noVoice();};
    say.u=u; speechSynthesis.resume(); speechSynthesis.speak(u);
    setTimeout(()=>{if(!VOICE&&!pickVoice()) noVoice();},1500);
  }catch(e){noVoice();}};
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel(); setTimeout(go,80);} else go();
}
// ---------------------------------------------------------------- geometry helpers
function el(n,a,p){const e=document.createElementNS(NS,n); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e;}
function plen(P){let L=0;for(let i=1;i<P.length;i++)L+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);return L;}
function resample(P,n){
  const L=plen(P); if(L===0) return Array(n).fill(P[0]);
  const out=[P[0]]; let acc=0,i=1,step=L/(n-1),need=step,prev=P[0];
  while(out.length<n-1&&i<P.length){
    const d=Math.hypot(P[i][0]-prev[0],P[i][1]-prev[1]);
    if(acc+d>=need){const t=(need-acc)/d; const q=[prev[0]+(P[i][0]-prev[0])*t,prev[1]+(P[i][1]-prev[1])*t]; out.push(q); prev=q; acc=need; need+=step;}
    else{acc+=d; prev=P[i]; i++;}
  }
  out.push(P[P.length-1]); return out;
}
function dseg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy; let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}
function dpoly(p,P){let m=1e9;for(let i=1;i<P.length;i++)m=Math.min(m,dseg(p,P[i-1],P[i]));return P.length===1?Math.hypot(p[0]-P[0][0],p[1]-P[0][1]):m;}
function area(P){let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;}
// centre line the reveal pen follows, carried a little past both ends so the stroke's tips are covered
function penPath(st){
  const P=st.pts.slice();
  if(st.ring){ // a ring is a loop: run a little past the start so it closes
    const extra=P.slice(1,6); return P.concat(extra);
  }
  const e=st.reach;
  const a=P[0],b=P[1],y=P[P.length-1],z=P[P.length-2];
  const u=[a[0]-b[0],a[1]-b[1]],lu=Math.hypot(...u)||1, v=[y[0]-z[0],y[1]-z[1]],lv=Math.hypot(...v)||1;
  return [[a[0]+u[0]/lu*e,a[1]+u[1]/lu*e]].concat(P,[[y[0]+v[0]/lv*e,y[1]+v[1]/lv*e]]);
}
const dpath=P=>"M"+P.map(p=>p[0].toFixed(2)+" "+p[1].toFixed(2)).join("L");
// ---------------------------------------------------------------- one letter box as SVG
let uid=0;
function letterSVG(b,opts){
  const s=b.side, svg=el("svg",{viewBox:`0 0 ${s} ${s}`,"aria-hidden":"true"});
  const r=Math.max(2,s*0.055);
  el("rect",{x:0.75,y:0.75,width:s-1.5,height:s-1.5,rx:r,fill:"#fff",stroke:"#cfc8be","stroke-width":1.2},svg);
  el("path",{d:`M${s/2} 3V${s-3}M3 ${s/2}H${s-3}`,stroke:"#e7e1d8","stroke-width":0.8,"stroke-dasharray":"2.2 2.2",fill:"none"},svg);
  const id="b"+(uid++);
  const defs=el("defs",{},svg);
  // the finished letter (static)
  const still=el("g",{},svg);
  for(const it of b.items) el("path",{d:it.d,fill:opts.color||it.fill,stroke:it.stroke||"none","stroke-width":it.sw?it.sw*2:0,"paint-order":"stroke"},still);
  // the moving letter: every stroke's own pixels, uncovered by its pen
  const moving=el("g",{style:"display:none"},svg);
  const pens=[];
  b.strokes.forEach((st,k)=>{
    const it=b.items[st.item];
    const cp=el("clipPath",{id:`${id}c${k}`},defs); el("path",{d:st.region},cp);
    const mk=el("mask",{id:`${id}m${k}`,maskUnits:"userSpaceOnUse",x:-10,y:-10,width:s+20,height:s+20},defs);
    const P=penPath(st), L=plen(P);
    const pen=el("path",{d:dpath(P),fill:"none",stroke:"#fff","stroke-width":st.reach*2,"stroke-linecap":"butt","stroke-linejoin":"round","stroke-dasharray":`${L} ${L+1}`,"stroke-dashoffset":L},mk);
    const g=el("g",{mask:`url(#${id}m${k})`},moving);
    // the letter's own crisp outline, cut to the part this stroke writes
    el("path",{d:it.d,fill:opts.color||it.fill,stroke:opts.color?"none":(it.stroke||"none"),"stroke-width":it.sw?it.sw*2:0,"paint-order":"stroke","clip-path":`url(#${id}c${k})`},g);
    pens.push({pen,L,st});
  });
  const ink=el("g",{class:"ink"},svg);
  const hint=el("g",{},svg);
  return {svg,still,moving,pens,ink,hint,b};
}
// stroke timings: the same pen speed as the GIFs
function timings(b){ return b.strokes.map(st=>[st.t0,st.t1]); }     // exactly the GIF's timing
function play(L,done,only){
  L.still.style.display="none"; L.moving.style.display="";
  const T=timings(L.b); const t0=performance.now()/1000;
  L.pens.forEach((p,k)=>{p.pen.setAttribute("stroke-dashoffset",(only==null||k>=only)?p.L:0);});
  const range=only==null?[0,L.pens.length]:[only,only+1];
  const base=T[range[0]][0];
  if(L.raf) cancelAnimationFrame(L.raf);
  const step=()=>{
    const t=performance.now()/1000-t0+base; let busy=false;
    for(let k=range[0];k<range[1];k++){
      const [a,c]=T[k]; const f=Math.max(0,Math.min(1,(t-a)/(c-a)));
      L.pens[k].pen.setAttribute("stroke-dashoffset",L.pens[k].L*(1-f)); if(f<1) busy=true;
    }
    if(busy) L.raf=requestAnimationFrame(step);
    else{ if(only==null){L.still.style.display="";L.moving.style.display="none";} if(done) done(); }
  };
  L.raf=requestAnimationFrame(step);
}
// ---------------------------------------------------------------- checking a written stroke against the book's
function judge(child,ref,side,k){
  const c=resample(child.map(p=>[p[0]/side,p[1]/side]),32);
  const r=resample(ref.pts.map(p=>[p[0]/side,p[1]/side]),32);
  const cL=plen(c), rL=plen(r);
  const fit=c.reduce((s,p)=>s+dpoly(p,r),0)/c.length;          // how close the child stays to the line
  const cover=r.reduce((s,p)=>s+dpoly(p,c),0)/r.length;        // how much of the line the child covered
  const d0=Math.hypot(c[0][0]-r[0][0],c[0][1]-r[0][1]);
  if(ref.ring){
    const closed=Math.hypot(c[0][0]-c[c.length-1][0],c[0][1]-c[c.length-1][1]);
    if(cL<0.45*rL) return "shape";
    if(d0>0.17) return "start";
    if(Math.sign(area(c))!==Math.sign(area(r))) return "dir";
    if(fit>0.075||cover>0.085||closed>0.22) return "shape";
    return "ok";
  }
  const d1=Math.hypot(c[c.length-1][0]-r[r.length-1][0],c[c.length-1][1]-r[r.length-1][1]);
  const rev0=Math.hypot(c[0][0]-r[r.length-1][0],c[0][1]-r[r.length-1][1]);
  if(cL<0.4*rL) return "shape";
  if(d0>0.16&&rev0<0.16) return "dir";
  if(d0>0.16) return "start";
  if(d1>0.18||fit>0.07||cover>0.08||cL>1.7*rL) return "shape";
  return "ok";
}
const TELL={
  start:"시작하는 곳이 달라요. 반짝이는 점에서 시작해요.",
  dir:"방향이 반대예요. 화살표를 따라 써요.",
  order:"쓰는 순서가 달라요. 먼저 이 획을 써요.",
  shape:"선을 따라 천천히 다시 써 봐요."
};
const PRAISE=["참 잘했어요!","멋져요!","바르게 썼어요!"];

// ---------------------------------------------------------------- the book
const book=document.getElementById("book"), jump=document.getElementById("jump");
const DATA={}, VIEWS={};
const pct=(v,of)=>(v/of*100).toFixed(4)+"%";
jump.insertAdjacentHTML("beforeend",`<option value="1">처음부터 보기</option>`);
BIG.forEach((pg,k)=>jump.insertAdjacentHTML("beforeend",`<option value="${pg}">${two(k+1)}과 큰 칸에 써요 · ${pg}쪽</option>`));
jump.onchange=()=>{const s=document.getElementById("p"+jump.value); if(s) s.scrollIntoView({behavior:"smooth"}); jump.blur();};
for(let n=1;n<=NPAGES;n++){
  const big=BIG.includes(n);
  if(big){
    const bar=document.createElement("div"); bar.className="pbar"; bar.style.maxWidth="900px";
    bar.innerHTML=`<span>${two(lessonOf(n))}과 · 큰 칸에 써요 — 칸을 눌러 써 보세요</span><span style="flex:1"></span><button class="tool" data-print="${n}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><path d="M6 14h12v7H6z"/></svg>이 쪽 인쇄</button>`;
    book.appendChild(bar);
  }
  const s=document.createElement("section"); s.className="pg"; s.id="p"+n; s.dataset.n=n;
  s.innerHTML=`<img src="p${String(n).padStart(3,"0")}.webp" alt="${n}쪽" loading="${n<=3?"eager":"lazy"}" decoding="async">`+(big?`<div class="ov"></div>`:"");
  book.appendChild(s);
}
book.addEventListener("click",e=>{const b=e.target.closest("[data-print]"); if(!b) return;
  const pg=b.dataset.print; document.querySelectorAll(".pg.pr").forEach(x=>x.classList.remove("pr"));
  document.getElementById("p"+pg).classList.add("pr"); document.body.classList.add("one");
  setTimeout(()=>{window.print(); document.body.classList.remove("one");},50);});
async function loadPage(pg){
  if(!DATA[pg]) DATA[pg]=fetch(`d${String(pg).padStart(3,"0")}.json`).then(r=>r.json());
  return DATA[pg];
}
async function buildPage(pg){
  if(VIEWS[pg]) return; VIEWS[pg]=[];
  const d=await loadPage(pg), ov=document.querySelector(`#p${pg} .ov`);
  d.boxes.forEach((b,i)=>{
    const box=document.createElement("div"); box.className="box"; box.dataset.i=i;
    box.style.cssText=`left:${pct(b.box[0],W)};top:${pct(b.box[1],H)};width:${pct(b.side,W)};height:${pct(b.side,H)}`;
    box.setAttribute("role","button"); box.setAttribute("aria-label",b.ch||"글자");
    const L=letterSVG(b,{}); box.appendChild(L.svg);
    if(b.kind==="see"){
      box.insertAdjacentHTML("beforeend",'<span class="play"><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4v16l13-8z"/></svg></span>');
      box.onclick=()=>{say(sound(b.ch)); play(L);};
    }else{
      box.insertAdjacentHTML("beforeend",'<span class="badge">✓</span>');
      box.onclick=()=>openPractice(pg,i);
    }
    VIEWS[pg][i]={L,box}; ov.appendChild(box);
  });
  refreshPage(pg);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target); buildPage(+e.target.dataset.n);}}),{rootMargin:"900px 0px"});
BIG.forEach(pg=>io.observe(document.getElementById("p"+pg)));
function refreshPage(pg){
  const V=VIEWS[pg]; if(!V||!V.length) return; const R=recs(pg);
  DATA[pg].then(d=>d.boxes.forEach((b,i)=>{
    if(b.kind==="see") return;
    V[i].box.classList.toggle("done",!!(R[i]&&R[i].done));
    drawInk(V[i].L.ink,R[i]&&R[i].ink,b);
  }));
}
function drawInk(g,ink,b){
  while(g.firstChild) g.removeChild(g.firstChild);
  if(!ink) return;
  const w=Math.max(2.4,b.strokes[0].w*0.42);
  for(const P of ink) el("path",{d:dpath(P.map(p=>[p[0]*b.side,p[1]*b.side])),fill:"none",stroke:"#3a3a44","stroke-width":w,"stroke-linecap":"round","stroke-linejoin":"round",opacity:.85},g);
}
// ---------------------------------------------------------------- practice in the big box
const modal=document.getElementById("modal"), bigEl=document.getElementById("big");
let P=null;
async function openPractice(pg,i){
  const d=await loadPage(pg), b=d.boxes[i];
  // the coloured letter shown when the child gets it right: the page's own '보기' box of that letter, else the ink colour
  const see=d.boxes.find(x=>x.kind==="see"&&x.ch===b.ch);
  bigEl.innerHTML="";
  const L=letterSVG(b,{}); bigEl.appendChild(L.svg);
  const stars=document.createElement("div"); stars.className="stars"; stars.innerHTML="<span>⭐</span>"; bigEl.appendChild(stars);
  document.getElementById("which").innerHTML=`${two(lessonOf(pg))}과<b>${b.ch||""}</b>`;
  P={pg,i,b,L,see,strokes:[],cur:null,k:0,busy:false,stars};
  modal.classList.add("on");
  rec(pg,i);
  say(sound(b.ch));
  showStart(0);
}
function showStart(k){
  const {L,b}=P; const g=L.hint; while(g.firstChild) g.removeChild(g.firstChild);
  if(k>=b.strokes.length) return;
  const st=b.strokes[k], s=b.side, a=st.pts[0];
  el("circle",{cx:a[0],cy:a[1],r:s*0.045,fill:"#d2763f",class:"pulse"},g);
  const q=resample(st.pts,12); const p1=q[Math.min(3,q.length-1)];
  const ang=Math.atan2(p1[1]-a[1],p1[0]-a[0]); const ah=s*0.05;
  const tip=[a[0]+Math.cos(ang)*s*0.11,a[1]+Math.sin(ang)*s*0.11];
  el("path",{d:`M${a[0]} ${a[1]}L${tip[0]} ${tip[1]}`,stroke:"#d2763f","stroke-width":s*0.012,"stroke-linecap":"round"},g);
  el("path",{d:`M${tip[0]+Math.cos(ang+2.5)*ah} ${tip[1]+Math.sin(ang+2.5)*ah}L${tip[0]} ${tip[1]}L${tip[0]+Math.cos(ang-2.5)*ah} ${tip[1]+Math.sin(ang-2.5)*ah}`,stroke:"#d2763f","stroke-width":s*0.012,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"},g);
}
function toLocal(e){
  const svg=P.L.svg, pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const q=pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x,q.y];
}
bigEl.addEventListener("pointerdown",e=>{
  if(!P||P.busy) return; e.preventDefault(); bigEl.setPointerCapture(e.pointerId);
  const p=toLocal(e); const w=Math.max(2.4,P.b.strokes[0].w*0.42);
  P.cur={pts:[p],node:el("path",{d:dpath([p,p]),fill:"none",stroke:"#3a3a44","stroke-width":w,"stroke-linecap":"round","stroke-linejoin":"round"},P.L.ink)};
});
bigEl.addEventListener("pointermove",e=>{
  if(!P||!P.cur) return; e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of evs){const p=toLocal(ev); const q=P.cur.pts[P.cur.pts.length-1]; if(Math.hypot(p[0]-q[0],p[1]-q[1])>0.35) P.cur.pts.push(p);}
  P.cur.node.setAttribute("d",dpath(P.cur.pts));
});
function endStroke(){
  if(!P||!P.cur) return;
  const cur=P.cur; P.cur=null;
  if(plen(cur.pts)<P.b.side*0.03){cur.node.remove(); return;}
  const k=P.k, ref=P.b.strokes[k], R=rec(P.pg,P.i);
  let v=judge(cur.pts,ref,P.b.side,k);
  if(v!=="ok"){ for(let j=k+1;j<P.b.strokes.length;j++) if(judge(cur.pts,P.b.strokes[j],P.b.side,j)==="ok"){v="order";break;} }
  if(v==="ok"){
    P.strokes.push(cur.pts); P.k++;
    if(P.k>=P.b.strokes.length) success(); else showStart(P.k);
  }else{
    R.tries++; R.fails[v]++; R.last=Date.now(); save();
    cur.node.setAttribute("stroke","#d2763f");
    bigEl.classList.remove("shake"); void bigEl.offsetWidth; bigEl.classList.add("shake");
    say(TELL[v]); P.busy=true;
    setTimeout(()=>{cur.node.remove(); play(P.L,()=>{P.busy=false; P.L.moving.style.display="none"; P.L.still.style.display=""; showStart(P.k);},k);},700);
  }
}
bigEl.addEventListener("pointerup",endStroke); bigEl.addEventListener("pointercancel",endStroke);
function success(){
  const R=rec(P.pg,P.i), side=P.b.side;
  R.tries++; R.done=true; R.last=Date.now();
  R.ink=P.strokes.map(S=>resample(S,Math.min(40,Math.max(8,S.length))).map(p=>[+(p[0]/side).toFixed(3),+(p[1]/side).toFixed(3)]));
  save(); P.busy=true;
  const g=P.L.hint; while(g.firstChild) g.removeChild(g.firstChild);
  const L=P.L; L.still.style.display="none";
  const C=P.see?letterSVG(P.see,{}):letterSVG(P.b,{color:"#3a3a44"}); C.svg.style.cssText="position:absolute;inset:0";
  C.svg.querySelector("rect").setAttribute("fill","none"); C.svg.querySelector("rect").setAttribute("stroke","none");
  bigEl.insertBefore(C.svg,P.stars);
  play(C,()=>{P.stars.classList.add("on"); say(PRAISE[(R.tries+P.i)%PRAISE.length]); setTimeout(closePractice,1700);});
}
function closePractice(){ if(P&&P.L.raf) cancelAnimationFrame(P.L.raf); const pg=P&&P.pg; modal.classList.remove("on"); P=null; if(pg) refreshPage(pg); }
document.getElementById("mClose").onclick=closePractice;
document.getElementById("mClear").onclick=()=>{ if(!P||P.busy) return; const g=P.L.ink; while(g.firstChild) g.removeChild(g.firstChild); P.strokes=[]; P.k=0; showStart(0); };
document.getElementById("mShow").onclick=()=>{
  if(!P||P.busy) return; P.busy=true; const g=P.L.hint; while(g.firstChild) g.removeChild(g.firstChild);
  say(sound(P.b.ch));
  play(P.L,()=>{P.busy=false; showStart(P.k);});
};
// ---------------------------------------------------------------- parent view (press and hold, so children do not open it)
const pb=document.getElementById("parentBtn"), hb=document.getElementById("holdbar"); let holdT=null,holdS=0;
function holdStart(e){ e.preventDefault(); holdS=performance.now();
  const tick=()=>{const f=Math.min(1,(performance.now()-holdS)/1500); hb.style.width=(f*100)+"%"; if(f>=1){holdEnd(); openParent();} else holdT=requestAnimationFrame(tick);};
  holdT=requestAnimationFrame(tick); }
function holdEnd(){ cancelAnimationFrame(holdT); hb.style.width="0"; }
pb.addEventListener("pointerdown",holdStart); ["pointerup","pointerleave","pointercancel"].forEach(t=>pb.addEventListener(t,holdEnd));
pb.addEventListener("click",()=>{ if(!document.getElementById("parent").classList.contains("on")) say("부모님 보기는 길게 누르세요."); });
async function openParent(){
  const list=document.getElementById("plist"); list.innerHTML="";
  document.getElementById("parent").classList.add("on");
  const why={start:"시작 위치",dir:"쓰는 방향",order:"쓰는 순서",shape:"모양"};
  let done=0,total=0;
  for(const pg of BIG){
    const d=await loadPage(pg), R=recs(pg);
    const tr=d.boxes.map((b,i)=>[b,i]).filter(([b])=>b.kind!=="see");
    const nd=tr.filter(([b,i])=>R[i]&&R[i].done).length; done+=nd; total+=tr.length;
    const sec=document.createElement("div"); sec.className="les";
    sec.innerHTML=`<h3>${two(lessonOf(pg))}과<small>${pg}쪽 · ${tr.length}칸 중 ${nd}칸</small></h3>`;
    const cells=document.createElement("div"); cells.className="cells";
    for(const [b,i] of tr){
      const r=R[i]; if(!r) continue;
      const cell=document.createElement("div"); cell.className="pcell";
      const L=letterSVG(b,{}); drawInk(L.ink,r.ink,b); cell.appendChild(L.svg);
      const f=Object.entries(r.fails).filter(x=>x[1]>0).sort((a,c)=>c[1]-a[1]);
      cell.insertAdjacentHTML("beforeend",`<b>${r.done?"✓ 바르게":"연습 중"}</b>${r.tries}번 시도`+(f.length?`<br>어려워한 것: ${why[f[0][0]]}`:"")+(r.last?`<br>${new Date(r.last).toLocaleDateString("ko-KR")}`:""));
      cells.appendChild(cell);
    }
    if(!cells.children.length) cells.innerHTML=`<div class="pcell" style="text-align:left">아직 써 본 칸이 없어요.</div>`;
    sec.appendChild(cells); list.appendChild(sec);
  }
  document.getElementById("psum").textContent=`따라 쓰기 ${total}칸 중 ${done}칸을 바르게 썼어요. 기록은 이 기기에만 저장됩니다.`;
}
document.getElementById("pClose").onclick=()=>{document.getElementById("parent").classList.remove("on");document.getElementById("ask").classList.remove("on");};
document.getElementById("pReset").onclick=()=>document.getElementById("ask").classList.add("on");
document.getElementById("askNo").onclick=()=>document.getElementById("ask").classList.remove("on");
document.getElementById("askYes").onclick=()=>{mem={pages:{}};save();try{localStorage.removeItem("changjo-01-v1");}catch(e){}
  document.getElementById("ask").classList.remove("on");BIG.forEach(refreshPage);openParent();};
</script>
